name: mikan-slice

services:
  node:
    build: {context: ../.., dockerfile: Dockerfile}
    image: mikan:slice
    entrypoint: ["/usr/local/bin/mikan-node"]
    environment:
      MIKAN_DATA_DIR: /data/node
      # the test target lives on a private docker network
      MIKAN_ALLOW_PRIVATE: "true"
    volumes: ["data:/data", "run:/run/mikan"]
    # The panel takes a public host only as an IP or a full domain name.
    networks:
      default:
        aliases: [node.test]

  panel:
    image: mikan:slice
    depends_on: [node]
    environment:
      MIKAN_DATA_DIR: /data/panel
      MIKAN_PANEL_LISTEN: 0.0.0.0:2053
      # The automatic moves' windows in seconds instead of half hours.
      MIKAN_AUTOTUNE_SCALE: "0.01"
    volumes: ["data:/data", "run:/run/mikan"]

  # A remote node: the panel reaches it over mTLS by the name it was added with.
  node2:
    image: mikan:slice
    entrypoint: ["sh", "-c", "MIKAN_NODE_JOIN=$$(cat /work/node2.key) exec /usr/local/bin/mikan-node"]
    environment:
      MIKAN_DATA_DIR: /data/node
      MIKAN_ALLOW_PRIVATE: "true"
    volumes: ["work:/work:ro", "data2:/data"]
    networks:
      default:
        aliases: [node2.slice]
    profiles: ["node2"]

  target:
    build: {context: ../.., dockerfile: test/e2e/Dockerfile}
    command: ["target"]

  client:
    image: metacubex/mihomo:v1.19.31
    command: ["-d", "/tmp/mihomo", "-f", "/work/client.yaml"]
    volumes: ["work:/work:ro"]
    profiles: ["client"]

  # Plays the client's ISP: inside the client's network namespace it drops the client's
  # packets to the node's 443/tcp, like the DPI that blocks one port of a server.
  blocker:
    image: alpine:3
    network_mode: "service:client"
    cap_add: [NET_ADMIN]
    entrypoint: ["sh", "-c"]
    command:
      - apk add -q iptables >/dev/null && iptables -I OUTPUT -p tcp -d "$$(getent hosts node | cut -d' ' -f1)" --dport 443 -j REJECT --reject-with tcp-reset && echo "client → node:443/tcp dropped"
    profiles: ["blocker"]

  driver:
    image: golang:1.27
    working_dir: /src
    command: ["sleep", "infinity"]
    volumes:
      - "../..:/src:ro"
      - "work:/work"
      - "mikan-gomod:/go/pkg/mod"
      - "mikan-gocache:/root/.cache/go-build"

volumes:
  data: {}
  data2: {}
  run: {}
  work: {}
  mikan-gomod: {external: true}
  mikan-gocache: {external: true}
