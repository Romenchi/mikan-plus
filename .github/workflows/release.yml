name: release

# A tag vX.Y.Z on main publishes a release:
#   - the image to GitHub Packages (ghcr.io/<owner>/mikan), amd64 and arm64;
#   - the installer for x86_64 and aarch64;
#   - manifest.json signed with the release key (RELEASE_SIGNING_KEY), which the panel's
#     update check and the installer trust, and install.sh for the one-line install.
# A pre-release tag (vX.Y.Z-rc.N) is published as a pre-release and does not move :latest.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: web
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: go
        run: go test ./internal/...

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mikan-plus" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@v6
        env:
          # the build record would be one more artifact of the run; publish wants only the installers
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.name.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  installer:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: build
        working-directory: installer
        env:
          MIKAN_VERSION: ${{ github.ref_name }}
        run: |
          cargo zigbuild --release --locked --target ${{ matrix.target }}
          mkdir -p ../dist && cp target/${{ matrix.target }}/release/mikan ../dist/mikan-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: mikan-${{ matrix.arch }}
          path: dist/mikan-${{ matrix.arch }}

  publish:
    needs: [image, installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: mikan-*
          merge-multiple: true
      - name: manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          go run ./cmd/mikan-release manifest -version "$version" \
            -image "${{ needs.image.outputs.image }}" -digest "${{ needs.image.outputs.digest }}" \
            -asset x86_64=dist/mikan-x86_64 -asset aarch64=dist/mikan-aarch64 -out dist
          go run ./cmd/mikan-release verify dist/manifest.json
          cp installer/install.sh dist/install.sh
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $pre --verify-tag --title "mikan ${GITHUB_REF_NAME#v}" --notes-file dist/notes.md \
            dist/install.sh dist/mikan-x86_64 dist/mikan-aarch64 dist/manifest.json dist/manifest.json.sig
